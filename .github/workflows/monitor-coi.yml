name: Monitor COI semanal

on:
  workflow_dispatch:
  schedule:
    # Viernes 13:00 COT (18:00 UTC). GitHub puede ejecutar con algunos minutos de retraso.
    - cron: '0 18 * * 5'

permissions:
  contents: write

jobs:
  process-coi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Procesar COI y enviar Gmail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_CC: ${{ secrets.MAIL_CC }}
        run: python automatic_coi.py

      - name: Guardar estado automático en GitHub
        run: |
          git config user.name 'Monitor COI Bot'
          git config user.email 'monitor-coi-bot@users.noreply.github.com'
          git add automatic/status.json
          git diff --cached --quiet || git commit -m "Actualizar estado automatico COI"
          git push
